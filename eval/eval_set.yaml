  # --- NASA, scanned (OCR tolerance) ------------------------------------
  - id: q022
    question: What are the two principal types of unsteady phenomena affecting launch vehicles?
    ground_truth: >-
      Self-excited phenomena and externally excited phenomena.
    gold_doc_ids: [nasa-19670021251]
    category: ocr
    notes: >-
      From a 1967 microfiche scan. Even after hi_res OCR the reading order is
      partly scrambled, so this tests whether retrieval and synthesis survive
      degraded text. Expect this to be among the weakest questions -- that is
      the point of keeping it.

  - id: q023
    question: What did X-15 flight tests reveal about panel flutter?
    ground_truth: >-
      Tests of X-15 corrugation-stiffened panels revealed that panel flutter was
      very sudden and very severe, and that it did not stop unless conditions
      changed; it is a fatigue problem rather than an immediately explosive one.
    gold_doc_ids: [nasa-19670021251]
    category: ocr

  - id: q024
    question: What causes buffeting on a launch vehicle?
    ground_truth: >-
      Buffeting is pressure oscillation caused by separated flow over interstage
      areas, which can cause intensive fluctuating pressures and consequently
      severe structural loads.
    gold_doc_ids: [nasa-19670021251]
    category: ocr

  - id: q025
    question: What is engine-generated noise research directed toward?
    ground_truth: >-
      Research on engine-generated acoustics has been directed toward
      determining the predominant noise generation mechanisms in
      high-temperature rocket exhaust flows.
    gold_doc_ids: [nasa-19670021251]
    category: ocr

