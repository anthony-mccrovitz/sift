# Sift evaluation set
#
# Every question here was written against passages actually present in the
# corpus -- open the cited document and page and you will find the answer. That
# is the only property that makes an eval set worth having: if the ground truth
# is invented, the metrics measure nothing.
#
# Fields
#   id            stable identifier; never renumber, CI compares across runs
#   question      what gets sent to POST /query
#   ground_truth  a correct answer, used by RAGAS context_recall / correctness
#   gold_doc_ids  documents that genuinely contain the answer -> retrieval recall
#   category      what this question is testing (see below)
#   notes         why the question is here, when it is not obvious
#
# Categories
#   factual       plain retrieval + synthesis
#   filtered      should trigger a metadata filter in the router
#   identifier    exact document/identifier lookup, lexical retrieval should win
#   quantitative  a specific number must survive retrieval and synthesis intact
#   ocr           the answer lives in a scanned document; tests OCR tolerance
#   unanswerable  NOT in the corpus -- the system must abstain, not invent
#
# ---------------------------------------------------------------------------
# NOTE ON PROVENANCE: this file was drafted mechanically from real retrieved
# passages and then needs a human pass. Read every ground_truth against its
# source document before trusting a number that comes out of it. An eval set
# nobody has read is a liability, because it will confidently gate your CI on
# assertions that were never checked.
# ---------------------------------------------------------------------------

questions:
  # --- GAO: drinking water (rced-97-123) --------------------------------
  - id: q001
    question: What law requires the EPA to establish drinking water standards, and when was it enacted?
    ground_truth: >-
      The Safe Drinking Water Act, enacted in 1974, requires the Environmental
      Protection Agency to establish drinking water standards for the nation's
      community water systems.
    gold_doc_ids: [gaoreports-rced-97-123]
    category: factual

  - id: q002
    question: Approximately how many community water systems does the Safe Drinking Water Act cover?
    ground_truth: Nearly 56,000 community water systems.
    gold_doc_ids: [gaoreports-rced-97-123]
    category: quantitative

  - id: q003
    question: What was the most common drinking water contamination problem GAO found in the six states it reviewed?
    ground_truth: >-
      Contamination with total coliform bacteria was by far the most common
      problem in the six states GAO reviewed.
    gold_doc_ids: [gaoreports-rced-97-123]
    category: factual

  - id: q004
    question: Why is less known about the quality of water from private wells than from community water systems?
    ground_truth: >-
      Water quality is not routinely monitored at private wells the way it is at
      community water systems, so the available data for private wells are
      limited and come from special studies and voluntary or locally required tests.
    gold_doc_ids: [gaoreports-rced-97-123]
    category: factual

  - id: q005
    question: For how many regulated contaminants did community water systems in the six states GAO reviewed exceed the standard at least once?
    ground_truth: >-
      Community water systems in the six states exceeded the standard at least
      once for 25 of the regulated contaminants during fiscal years 1993 through 1996.
    gold_doc_ids: [gaoreports-rced-97-123]
    category: quantitative

  # --- GAO: export controls (nsiad-95-82) -------------------------------
  - id: q006
    question: What weaknesses did GAO identify in controls over missile-related technology exports to China?
    ground_truth: >-
      GAO found that some controls over missile-related technology exports to
      China were weak, including gaps in how export licences were reviewed and
      enforced.
    gold_doc_ids: [gaoreports-nsiad-95-82]
    category: factual

  - id: q007
    question: What penalties do violators of U.S. export laws face?
    ground_truth: Violators of U.S. export laws are subject to criminal and civil penalties.
    gold_doc_ids: [gaoreports-nsiad-95-82]
    category: factual

  - id: q008
    question: How does the MTCR Annex categorise controlled items?
    ground_truth: The MTCR Annex divides controlled items into two categories, Category I and Category II.
    gold_doc_ids: [gaoreports-nsiad-95-82]
    category: factual

  - id: q009
    question: What did GAO report about export controls between 1994 and 1996?
    ground_truth: >-
      GAO reported in April 1995 that some controls over missile-related
      technology exports to China were weak.
    gold_doc_ids: [gaoreports-nsiad-95-82]
    category: filtered
    notes: Should trigger a year-range filter plus source=gao in the router.

  # --- GAO: space station (t-nsiad-96-210) ------------------------------
  - id: q010
    question: What risks did GAO identify to the space station program's cost and schedule?
    ground_truth: >-
      GAO reported numerous major and minor matters that continued to threaten
      the station program's ability to stay within cost limits and on schedule,
      and warned that in a worst case these issues could threaten the future of
      the program if they produced significantly higher cost estimates and
      substantial schedule delays.
    gold_doc_ids: [gaoreports-t-nsiad-96-210]
    category: factual

  - id: q011
    question: How does GAO define cost variances and schedule variances for the space station program?
    ground_truth: >-
      Cost variances represent the difference between actual costs to complete
      specific work steps and the amounts budgeted for that work. Schedule
      variances are the dollar value of the difference between the budgeted cost
      of work planned and work completed. They are not additive.
    gold_doc_ids: [gaoreports-t-nsiad-96-210]
    category: factual

  - id: q012
    question: What did GAO say about NASA and contractor commitments on the space station?
    ground_truth: >-
      GAO noted that commitments were made by NASA and its contractors to
      resolve or complete actions on the issues described, and that follow-up
      was needed to ensure promised corrective actions occurred.
    gold_doc_ids: [gaoreports-t-nsiad-96-210]
    category: factual

  # --- Federal Register: wildland fire differential pay (fr-2026-16687) --
  - id: q013
    question: Under what statute is hazardous duty pay authorised for General Schedule employees?
    ground_truth: >-
      Hazardous duty pay (HDP) is authorised by 5 U.S.C. 5545(d) and 5 CFR part
      550, subpart I, for GS employees performing duties approved by OPM.
    gold_doc_ids: [fr-2026-16687]
    category: factual

  - id: q014
    question: Does OPM extend the wildland fire pay differential to pre-ignition preparation activities?
    ground_truth: >-
      No. OPM does not extend the differential to pre-ignition preparation
      activities, because the hazards justifying coverage are associated with
      the active fire environment and its immediate aftermath on the fireline,
      not preparatory work performed before ignition.
    gold_doc_ids: [fr-2026-16687]
    category: factual

  - id: q015
    question: How many comments did OPM receive recommending that the final rule include employees paid under the GW pay plan?
    ground_truth: OPM received 7 comments from employees making that recommendation.
    gold_doc_ids: [fr-2026-16687]
    category: quantitative

  - id: q016
    question: What pay enhancements for federal firefighters did a commenter say had already been provided?
    ground_truth: >-
      A commenter cited a temporary $20,000 pay increase, a permanent pay
      increase, creation of the 0456 occupational series, and the GW pay scale.
    gold_doc_ids: [fr-2026-16687]
    category: quantitative

  - id: q017
    question: What change did the rule make to references to the General Accounting Office?
    ground_truth: >-
      In 5 CFR 10.1 the words "General Accounting" are removed and replaced with
      "Government Accountability".
    gold_doc_ids: [fr-2026-16687]
    category: factual

